name: Packaging and installation

"on":
  pull_request:
    paths:
      - "scgeo/**"
      - "pyproject.toml"
      - "environment-user.yml"
      - "conda-recipe/**"
      - "scripts/smoke_installation.py"
      - ".github/workflows/packaging.yml"
  push:
    branches: [main]
    paths:
      - "scgeo/**"
      - "pyproject.toml"
      - "environment-user.yml"
      - "conda-recipe/**"
      - "scripts/smoke_installation.py"
      - ".github/workflows/packaging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  PYTHONNOUSERSITE: "1"

jobs:
  wheel:
    name: Wheel / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel through sdist and check distribution metadata
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Install wheel with declared core dependencies only
        run: |
          python -m pip install --only-binary=:all: dist/*.whl
          python -m pip check
      - name: Test installed distribution outside checkout
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          root = Path.cwd()
          subprocess.run(
              [sys.executable, str(root / "scripts/smoke_installation.py"),
               "--source-root", str(root)],
              cwd=os.environ["RUNNER_TEMP"], check=True,
          )
          PY

  conda:
    name: Conda environment and native local package / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          miniforge-version: latest
          activate-environment: scgeo-build
          python-version: "3.12"
          channels: conda-forge
          channel-priority: strict
          auto-activate-base: false
      - name: Install build tools
        run: conda install -y --override-channels -c conda-forge conda-build pyyaml
      - name: Point a temporary user environment at this checkout, not main
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml
          environment = yaml.safe_load(Path("environment-user.yml").read_text())
          environment["name"] = "scgeo-install-check"
          for dependency in environment["dependencies"]:
              if isinstance(dependency, dict) and "pip" in dependency:
                  dependency["pip"] = [str(Path.cwd())]
          path = Path(os.environ["RUNNER_TEMP"]) / "scgeo-environment.yml"
          path.write_text(yaml.safe_dump(environment, sort_keys=False))
          PY
          conda env create -f "$RUNNER_TEMP/scgeo-environment.yml"
      - name: Test user environment
        run: |
          conda run -n scgeo-install-check python -m pip check
          ROOT="$PWD"
          cd "$RUNNER_TEMP"
          conda run -n scgeo-install-check python "$ROOT/scripts/smoke_installation.py" --source-root "$ROOT"
      - name: Build and test native conda package without uploading
        run: conda run -n scgeo-build conda-build conda-recipe --override-channels -c conda-forge --python 3.12 --no-anaconda-upload
