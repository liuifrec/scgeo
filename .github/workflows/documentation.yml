name: Documentation and examples

"on":
  pull_request:
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "CITATION.*"
      - "docs/**"
      - "examples/**"
      - "tests/**"
      - "scgeo/**"
      - "api_manifest.json"
      - "scgeo_io*.json"
      - "scripts/check_documentation.py"
      - "scripts/rebuild_manifests.py"
      - "scripts/gen_api_docs.py"
      - "scripts/validate_manifests.py"
      - "scripts/tests/test_manifest_validation.py"
      - ".github/workflows/documentation.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "CITATION.*"
      - "docs/**"
      - "examples/**"
      - "tests/**"
      - "scgeo/**"
      - "api_manifest.json"
      - "scgeo_io*.json"
      - "scripts/check_documentation.py"
      - "scripts/rebuild_manifests.py"
      - "scripts/gen_api_docs.py"
      - "scripts/validate_manifests.py"
      - "scripts/tests/test_manifest_validation.py"
      - ".github/workflows/documentation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install documentation-check dependencies
        run: python -m pip install ".[scanpy]" pytest pyyaml
      - name: Check citation formats and documentation targets
        run: python scripts/check_documentation.py
      - name: Check the API against generated documentation
        run: |
          python scripts/validate_manifests.py
          python scripts/gen_api_docs.py --check
          python -m pytest scripts/tests/test_manifest_validation.py -q
      - name: Execute the synthetic quick start
        run: python examples/quickstart.py --output-dir "$RUNNER_TEMP/scgeo-quickstart"
      - name: Execute the plotting gallery
        run: python examples/plotting_gallery.py --output-dir "$RUNNER_TEMP/scgeo-plotting-gallery" --formats png svg pdf
      - name: Execute the PAGA shift-map gallery
        run: python examples/paga_shift_map_gallery.py --output-dir "$RUNNER_TEMP/scgeo-paga-gallery" --formats png svg pdf
      - name: Execute the local velocity-field gallery
        run: python examples/velocity_field_gallery.py --output-dir "$RUNNER_TEMP/scgeo-velocity-gallery" --formats png svg pdf
      - name: Execute the unified geometry-dynamics atlas gallery
        run: python examples/geometry_dynamics_atlas_gallery.py --output-dir "$RUNNER_TEMP/scgeo-atlas-gallery" --formats png svg pdf
      - name: Execute flexible embedding and velocity faceting gallery
        run: python examples/embedding_facets_gallery.py --dataset synthetic --output-dir "$RUNNER_TEMP/scgeo-facets-gallery" --formats png svg pdf
      - name: Execute composed plotting gallery
        run: python examples/plotting_composition_gallery.py --output-dir "$RUNNER_TEMP/scgeo-composition-gallery" --formats png svg pdf
      - name: Upload composed plots and both panel sources
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: scgeo-plotting-composition-gallery
          path: ${{ runner.temp }}/scgeo-composition-gallery/
          if-no-files-found: error
          retention-days: 14
      - name: Upload exact faceted plots and auditable source tables
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: scgeo-embedding-facets-gallery
          path: ${{ runner.temp }}/scgeo-facets-gallery/
          if-no-files-found: error
          retention-days: 14
      - name: Upload exact generated atlas figures and source tables
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: scgeo-geometry-dynamics-gallery
          path: ${{ runner.temp }}/scgeo-atlas-gallery/
          if-no-files-found: error
          retention-days: 14
      - name: Check the explicit real-data gallery entry point
        run: python examples/real_data_plotting_gallery.py --help
      - name: Check the explicit in-house review entry point without data
        run: python examples/mouse_geometry_velocity_review.py --help

  plotting:
    name: Plotting behavior / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install core plotting dependencies
        run: python -m pip install ".[dev]"
      - name: Check plotting semantics and backward compatibility
        run: >-
          python -m pytest tests/test_plot_exports.py tests/test_plot_evidence_upgrades.py
          tests/test_plot_composition_upgrades.py tests/test_comparison_replicate_plots.py
          tests/test_paga_visual_upgrades.py tests/test_velocity_field.py
          tests/test_state_flow_upgrades.py tests/test_density_visual_upgrades.py tests/test_geometry_velocity_interpretation.py tests/test_geometry_dynamics_atlas.py tests/test_embedding_facets.py tests/test_state_reporting.py
          tests/test_robust_shift.py tests/pl -q
