name: Documentation and examples

"on":
  pull_request:
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "CITATION.*"
      - "docs/**"
      - "examples/**"
      - "tests/**"
      - "scgeo/**"
      - "api_manifest.json"
      - "scgeo_io*.json"
      - "scripts/check_documentation.py"
      - "scripts/rebuild_manifests.py"
      - "scripts/gen_api_docs.py"
      - "scripts/validate_manifests.py"
      - "scripts/tests/test_manifest_validation.py"
      - ".github/workflows/documentation.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "CITATION.*"
      - "docs/**"
      - "examples/**"
      - "tests/**"
      - "scgeo/**"
      - "api_manifest.json"
      - "scgeo_io*.json"
      - "scripts/check_documentation.py"
      - "scripts/rebuild_manifests.py"
      - "scripts/gen_api_docs.py"
      - "scripts/validate_manifests.py"
      - "scripts/tests/test_manifest_validation.py"
      - ".github/workflows/documentation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install documentation-check dependencies
        run: python -m pip install ".[scanpy]" pytest pyyaml
      - name: Check citation formats and documentation targets
        run: python scripts/check_documentation.py
      - name: Check the API against generated documentation
        run: |
          python scripts/validate_manifests.py
          python scripts/gen_api_docs.py --check
          python -m pytest scripts/tests/test_manifest_validation.py -q
      - name: Execute the synthetic quick start
        run: python examples/quickstart.py --output-dir "$RUNNER_TEMP/scgeo-quickstart"
      - name: Execute the plotting gallery
        run: python examples/plotting_gallery.py --output-dir "$RUNNER_TEMP/scgeo-plotting-gallery" --formats png svg pdf

  plotting:
    name: Plotting behavior / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install core plotting dependencies
        run: python -m pip install ".[dev]"
      - name: Check plotting semantics and backward compatibility
        run: python -m pytest tests/test_plot_exports.py tests/test_plot_evidence_upgrades.py tests/test_plot_composition_upgrades.py tests/test_comparison_replicate_plots.py tests/test_state_reporting.py tests/test_robust_shift.py tests/pl -q
