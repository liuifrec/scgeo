name: Promote verified ScGeo release to PyPI

"on":
  pull_request:
    paths:
      - ".github/workflows/publish-pypi.yml"
      - "scripts/promote_release.py"
      - "scripts/pypi_promotion.py"
      - ".github/tests/**"
      - "docs/PYPI_PUBLICATION.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-pypi.yml"
      - "scripts/promote_release.py"
      - "scripts/pypi_promotion.py"
      - ".github/tests/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact release version, e.g. 0.2.0"
        type: string
        required: true
      staging_run_id:
        description: "Original successful Release checks and TestPyPI tag-push run ID"
        type: string
        required: true
      publish:
        description: "Publish the verified staged files to real PyPI (requires approval)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: scgeo-production-promotion
  cancel-in-progress: false

env:
  MPLBACKEND: Agg
  PYTHONNOUSERSITE: "1"

jobs:
  guard-tests:
    name: Offline promotion guard tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s .github/tests -p 'test_*.py' -v

  prepare:
    name: Verify original TestPyPI files (no upload)
    needs: guard-tests
    if: >-
      github.repository == 'liuifrec/scgeo' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      STAGING_RUN_ID: ${{ inputs.staging_run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate staging run, immutable tag, original artifacts and main ancestry
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/promote_release.py source "$RELEASE_VERSION" "$STAGING_RUN_ID" promotion-audit
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          repository: liuifrec/scgeo
          run-id: ${{ inputs.staging_run_id }}
          artifact-ids: ${{ steps.source.outputs.dist_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: staged-dist/
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          repository: liuifrec/scgeo
          run-id: ${{ inputs.staging_run_id }}
          artifact-ids: ${{ steps.source.outputs.audit_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: staged-audit/
      - name: Verify manifest, original distributions and live TestPyPI files
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: python scripts/promote_release.py prepare "$RELEASE_VERSION" "$SOURCE_COMMIT" staged-audit/release-manifest.json promotion-dist staged-dist
      - name: Smoke-test the exact staged wheel outside the checkout
        run: |
          python -m pip install --index-url https://pypi.org/simple --only-binary=:all: promotion-dist/*.whl
          python -m pip check
          ROOT="$PWD"
          cd "$RUNNER_TEMP"
          python "$ROOT/staged-audit/smoke_installation.py" --source-root "$ROOT"
      - name: Refuse to overwrite an existing production version
        if: inputs.publish
        run: python scripts/promote_release.py preflight "$RELEASE_VERSION"
      - name: Record source and tested hashes for owner review
        run: |
          cp staged-audit/release-manifest.json promotion-audit/
          cp staged-audit/smoke_installation.py promotion-audit/
          python -m pip freeze > promotion-audit/verification-environment.txt
          {
            echo '### Production release candidate (no rebuild)'
            echo 'Review the exact source, staging run and file hashes before approving.'
            echo '~~~json'
            cat promotion-audit/promotion-source.json promotion-audit/release-manifest.json
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: scgeo-pypi-distributions
          path: promotion-dist/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: scgeo-pypi-promotion-audit
          path: promotion-audit/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Approve publication to REAL PyPI
    needs: prepare
    if: >-
      github.repository == 'liuifrec/scgeo' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/scgeo/
    permissions:
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: scgeo-pypi-distributions
          path: dist/
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: scgeo-pypi-promotion-audit
          path: audit/
      - name: Recheck exact approved bytes without executing repository code
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          version = os.environ["RELEASE_VERSION"]
          commit = os.environ["SOURCE_COMMIT"]
          manifest = json.loads(Path("audit/release-manifest.json").read_text())
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version)
          assert re.fullmatch(r"[0-9a-f]{40}", commit)
          assert manifest["name"] == "scgeo" and manifest["version"] == version
          assert manifest["source_commit"] == commit and manifest["git_ref"] == f"refs/tags/v{version}"
          names = {f"scgeo-{version}-py3-none-any.whl", f"scgeo-{version}.tar.gz"}
          assert set(manifest["files"]) == names
          dist = Path("dist")
          assert dist.is_dir() and not dist.is_symlink()
          assert {p.name for p in dist.iterdir()} == names
          for name, digest in manifest["files"].items():
              path = dist / name
              assert re.fullmatch(r"[0-9a-f]{64}", digest)
              assert path.is_file() and not path.is_symlink() and path.stat().st_size <= 32 * 1024 * 1024
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest
          PY
      - name: Publish unchanged tested files using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://upload.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: false

  verify-pypi:
    name: Verify REAL PyPI hashes and fresh pip installation
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: scgeo-pypi-promotion-audit
          path: audit/
      - name: Verify production hashes against the original staging manifest
        run: python scripts/promote_release.py verify-pypi "$RELEASE_VERSION" "$SOURCE_COMMIT" audit/release-manifest.json production-downloads
      - name: Test the public pip command in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/scgeo-public-check"
          PY="$RUNNER_TEMP/scgeo-public-check/bin/python"
          "$PY" -m pip install --index-url https://pypi.org/simple --only-binary=:all: "scgeo==$RELEASE_VERSION"
          "$PY" -m pip check
          ROOT="$PWD"
          cd "$RUNNER_TEMP"
          "$PY" "$ROOT/audit/smoke_installation.py" --source-root "$ROOT"
      - name: Record successful publication verification
        run: |
          echo "### ScGeo $RELEASE_VERSION is verified on real PyPI" >> "$GITHUB_STEP_SUMMARY"
          echo 'Both file hashes match the original staging manifest. A fresh pip installation passed.' >> "$GITHUB_STEP_SUMMARY"
