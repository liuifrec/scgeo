[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scgeo"
version = "0.1.0"
description = "Geometric analysis of single-cell representations"
authors = [{name = "Yu-Chen Liu"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "numpy",
    "pandas",
    "anndata",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "plotly",
]

[project.urls]
Homepage = "https://github.com/liuifrec/scgeo"
Documentation = "https://github.com/liuifrec/scgeo/blob/main/docs/OVERVIEW.md"
Repository = "https://github.com/liuifrec/scgeo"
Issues = "https://github.com/liuifrec/scgeo/issues"
Publication = "https://doi.org/10.1093/bioadv/vbag266"
"Companion workflows" = "https://github.com/liuifrec/scgeo-notebooks"

[project.optional-dependencies]
dev = ["pytest", "ruff"]
census = ["cellxgene-census", "tiledbsoma", "pyarrow"]
notebook = ["jupyterlab", "ipykernel"]
# Retain existing extras for compatibility; these are now core dependencies.
plot = ["matplotlib"]
scanpy = ["scanpy"]
sklearn = ["scikit-learn"]
scvelo = [
  "scvelo>=0.3",
  "igraph",
  "leidenalg",
  "scikit-misc",
]
[tool.setuptools.packages.find]
include = ["scgeo", "scgeo.*"]
